services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: braindump
      POSTGRES_PASSWORD: braindump
      POSTGRES_DB: braindump
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U braindump -d braindump']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    command: ['pnpm', '--filter', '@bd/api', 'migrate']
    environment:
      DATABASE_URL: postgres://braindump:braindump@postgres:5432/braindump
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://braindump:braindump@postgres:5432/braindump
      PORT: '3001'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data: {}
